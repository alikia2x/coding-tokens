name: Bug report
description: Something crashed, showed the wrong numbers, or looks broken.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Session data contains prompts and file paths —
        redact anything private before pasting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Coding Tokens version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15.3 (Apple M2), Windows 11 x64, Ubuntu 24.04 x64"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Packaged desktop app (DMG / Setup)
        - From source (bun run dev:app)
        - Web UI (bun run web)
        - CLI
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, Console.app logs or screenshots.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed prompts, paths and tokens from the pasted output.
          required: true
