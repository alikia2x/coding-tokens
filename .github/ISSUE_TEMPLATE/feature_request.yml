name: Feature request
description: Suggest a view, metric, harness or workflow.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Overview and charts
        - Session detail and transcripts
        - Projects and models
        - Harness support
        - CLI and export
        - Desktop app and packaging
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same idea.
          required: true
