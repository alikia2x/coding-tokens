name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$version"
            exit 1
          fi
          echo "Releasing v$version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Electrobun devkit
        run: bunx electrobun prepare

      - name: Lint, typecheck and test
        run: bun run check && bun run typecheck && bun test

      - name: Build web assets
        run: bun run build

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: CodingTokens-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: CodingTokens-macos-x64
          - name: Linux x64
            os: ubuntu-24.04
            artifact: CodingTokens-linux-x64
          - name: Windows x64
            os: windows-2025
            artifact: CodingTokens-win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASES_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
      ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
      ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
      ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libpipewire-0.3-dev librsvg2-dev

      - name: Check macOS signing configuration
        id: signing
        if: runner.os == 'macOS' && matrix.os != 'macos-15-intel'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in CERT_P12 CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          for name in ELECTROBUN_DEVELOPER_ID ELECTROBUN_TEAMID ELECTROBUN_APPLEID ELECTROBUN_APPLEIDPASS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple Developer ID signing secrets configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets missing ($missing). Building unsigned macOS installer."
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && matrix.os != 'macos-15-intel' && steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app bundle
        if: matrix.os != 'macos-15-intel'
        run: bun run build:app
        env:
          CODESIGN: ${{ steps.signing.outputs.enabled == 'true' && '1' || '0' }}
          NOTARIZE: ${{ steps.signing.outputs.enabled == 'true' && '1' || '0' }}

      - name: Build standalone CLI binary
        run: bun run build:cli

      - name: Verify signature and notarization
        if: runner.os == 'macOS' && matrix.os != 'macos-15-intel' && steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          APP="$(find build -maxdepth 2 -type d -name 'Coding Tokens.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Signed app bundle was not produced"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign.txt"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"

      - name: Check notarization ticket on installer
        if: runner.os == 'macOS' && matrix.os != 'macos-15-intel' && steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          DMG="$(find artifacts -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -n "$DMG" ]; then xcrun stapler validate "$DMG"; fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && matrix.os != 'macos-15-intel' && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Coding Tokens ${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Coding Tokens ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
