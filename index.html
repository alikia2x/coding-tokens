<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f6f7" />
		<title>Coding Tokens</title>
		<style>
			@layer base {
				html,
				body {
					margin: 0;
					min-height: 100vh;
					background: #f6f6f7;
					color: #16171a;
				}
				html.dark,
				html.dark body {
					background: #0e0e10;
					color: #e8e8ea;
				}
			}
			.boot-splash {
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				padding: 0 24px;
				font-family:
					"Google Sans Flex", "PingFang SC", "Noto Sans SC", ui-sans-serif,
					system-ui, sans-serif;
			}
			.boot-splash-inner {
				width: 100%;
				max-width: 384px;
			}
			.boot-splash-title {
				margin-bottom: 20px;
				font-size: 16px;
				font-weight: 500;
				letter-spacing: -0.01em;
			}
			.boot-splash-bar {
				height: 4px;
				overflow: hidden;
				border-radius: 9999px;
				background: rgba(128, 128, 128, 0.16);
			}
			.boot-splash-bar > div {
				width: 6%;
				height: 100%;
				background: currentColor;
			}
		</style>
		<script>
			(() => {
				try {
					const mode = localStorage.getItem("coding-tokens-theme") || "system";
					const dark =
						mode === "dark" ||
						(mode === "system" &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
					document.documentElement.style.colorScheme = dark ? "dark" : "light";
					document
						.querySelector('meta[name="theme-color"]')
						?.setAttribute("content", dark ? "#0e0e10" : "#f6f6f7");
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="root">
			<div class="boot-splash">
				<div class="boot-splash-inner">
					<div class="boot-splash-title">Coding Tokens</div>
					<div class="boot-splash-bar"><div></div></div>
				</div>
			</div>
		</div>
		<script type="module" src="/app/main.tsx"></script>
	</body>
</html>
